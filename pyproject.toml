[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scoa-reproduction"
version = "0.1.0"
description = "Paper-driven YOLOX SCOA reconstruction with explicit evidence boundaries"
requires-python = ">=3.9,<3.13"
dependencies = [
  "numpy==1.26.4",
  "opencv-python-headless==4.8.1.78",
  "PyYAML==6.0.1",
  "loguru==0.7.2",
  "Pillow==10.4.0",
]

[project.optional-dependencies]
test = ["pytest==8.3.5"]
evaluation = ["pycocotools==2.0.11"]

[tool.setuptools.packages.find]
include = ["scoa*"]

[tool.setuptools.package-data]
"scoa._vendor" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
