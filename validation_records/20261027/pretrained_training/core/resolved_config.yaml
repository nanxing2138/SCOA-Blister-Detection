basic:
  degrees: 5.0
  flip_prob: 0.5
  hsv_gains:
  - 5
  - 30
  - 30
  hsv_prob: 0.8
  mosaic_prob: 1.0
  scale:
  - 0.8
  - 1.2
  shear: 2.0
  translate: 0.1
data:
  image_dir: images
  root: data/synthetic
  test: annotations/test.json
  train: annotations/train.json
  val: annotations/val.json
evaluation:
  max_detections: 100
  nms: standard
  nms_threshold: 0.45
  pr_threshold: 0.25
  score_threshold: 0.001
model:
  cbam: false
  depth: 0.33
  width: 0.5
  wiou: false
name: synthetic_smoke_only
optical:
  amplitudes:
  - 0.5
  - 1.0
  - 1.5
  difficulty_average: class
  epsilon_q: 0.0001
  grid: 4
  hard_start_epoch: 1
  policy: D
  probability: 1.0
  quantile: 0.25
  smr_weights: null
  structure_mode: quantile
  structure_threshold: 0.75
  variance_threshold: 0.0001
output: runs/verification_pretrained/core
train:
  allow_scratch: false
  amp: false
  batch_size: 2
  checkpoint_nms: standard
  deterministic: true
  epochs: 1
  input_size: 64
  log_every: 1
  lr: 0.000625
  min_lr_ratio: 0.05
  momentum: 0.9
  nesterov: true
  no_aug_epochs: 0
  pretrained: weights/yolox_s.pth
  seed: 42
  val_every: 1
  warmup_epochs: 0
  warmup_lr: 0.0
  weight_decay: 0.0005
  workers: 0
